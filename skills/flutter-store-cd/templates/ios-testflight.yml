# iOS build and upload to TestFlight.
#
# Fires only on a `v*` tag. macOS runners bill at 10x: on the Free plan, 2,000
# minutes become ~200 macOS minutes, a few dozen builds a month. Building on
# every push burns the quota for nothing.
#
# No secret lives in this file.
#
# Secrets:
#   IOS_DIST_CERT_P12              Apple Distribution certificate (.p12), base64
#   IOS_DIST_CERT_PASSWORD         password used when exporting that .p12
#   IOS_PROVISION_PROFILE          App Store provisioning profile, base64
#   APP_STORE_CONNECT_KEY_ID       App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_PRIVATE_KEY  the whole .p8 file content
#
# Variables (not secret):
#   APPLE_TEAM_ID                  e.g. A1B2C3D4E5
#   IOS_PROFILE_NAME               exact profile name in the developer portal
#
# Base64 on a Mac:
#   base64 -i cert.p12 | pbcopy
#   base64 -i profile.mobileprovision | pbcopy

name: iOS - TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  testflight:
    # Pin Xcode. App Store Connect rejects uploads built with an SDK older
    # than the current required one ("Validation failed (409) SDK version
    # issue"), and the Firebase iOS SDK needs a recent Swift. Bump this when
    # Apple raises the minimum, together with a Flutter version that
    # supports that Xcode.
    runs-on: macos-15
    timeout-minutes: 60

    env:
      FLUTTER_VERSION: 3.38.3
      APP_DIR: .                       # folder with pubspec.yaml
      BUNDLE_ID: com.example.app       # iOS bundle id (case-sensitive!)

    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: cd "$APP_DIR" && flutter pub get

      # Gates first: seconds of work, no simulator, and they fail before any
      # expensive macOS compile time is spent.
      - name: Analyze
        run: cd "$APP_DIR" && flutter analyze

      - name: Test
        run: cd "$APP_DIR" && flutter test

      - name: Install certificate and provisioning profile
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail

          # A throwaway keychain keeps signing material out of the default one.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign opens an authorization prompt and the build
          # hangs until the timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROFILE" | base64 --decode > "$PROFILES/build.mobileprovision"

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      # Archive, then export. Manual signing (team, profile, identity) lives in
      # the Runner target's *Release* config in project.pbxproj, NOT on the
      # xcodebuild command line: passed there it applies to every target,
      # including the CocoaPods ones, which refuse a provisioning profile and
      # break the archive.
      - name: Build IPA
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          flutter build ios --release --no-codesign \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION=${{ github.ref_name }}

          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

          # The export names the file after the target; a fixed name keeps the
          # upload step independent of that.
          mv "$RUNNER_TEMP"/ipa/*.ipa "$RUNNER_TEMP/ipa/app.ipa"

      # altool ships with Xcode: one less third-party action.
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_FILE"

          # altool first downloads a config file from Apple's CDN, and that
          # download times out now and then (NSURLErrorDomain -1001). Three
          # spaced attempts cost seconds; losing a finished 15-minute build to
          # a transient timeout costs the whole build.
          for attempt in 1 2 3; do
            if xcrun altool --upload-app --type ios \
              --file "$RUNNER_TEMP/ipa/app.ipa" \
              --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"; then
              exit 0
            fi
            echo "upload failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          exit 1

      - name: Keep the IPA
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: warn
